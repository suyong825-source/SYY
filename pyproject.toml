[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syy-tools"
version = "0.1.0"
description = "안드로이드 최적화 CLI(andopt)와 서울시 테니스장 예약 조회 도구(courtfinder)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
andopt = "andopt.cli:main"
courtfinder = "courtfinder.cli:main"

[tool.setuptools.packages.find]
include = ["andopt*", "courtfinder*"]

[tool.setuptools.package-data]
courtfinder = ["template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
